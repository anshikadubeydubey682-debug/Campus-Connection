# ============================================================
# CampusConnect Portal - Spring Boot Application Configuration
# RKGITM Campus Portal Backend API
# ============================================================

# ---- Application Name ----
spring.application.name=campusconnect-portal

# ---- Server Configuration ----
server.port=8080
server.servlet.context-path=/api

# ---- MySQL Database Configuration ----
# IMPORTANT: Replace with your actual MySQL credentials before running
spring.datasource.url=jdbc:mysql://localhost:3306/campusconnect_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Anshika@9696
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate Settings ----
# 'update' creates tables automatically if they don't exist and updates schema
# Change to 'create' to reset on every restart (use 'validate' in production)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---- JWT Security Configuration ----
# IMPORTANT: Replace with a strong secret key (min 256-bit / 32 characters)
app.jwt.secret=CAMPUSCONNECT_RKGITM_SUPER_SECRET_JWT_KEY_2026_CHANGE_ME
app.jwt.expiration-ms=86400000

# ---- CORS (allows frontend to call API) ----
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:5500,http://localhost:5500

# ---- Spring Security ----
spring.security.user.name=admin
spring.security.user.password=admin_default

# ---- Logging ----
logging.level.org.springframework.security=DEBUG
logging.level.com.campusconnect=DEBUG
